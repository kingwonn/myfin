# 纸面组合账本 v1 —— 系统判断的可追责成绩单（不是真实仓位，永不下单）
#
# 规则（追加式，不改写）：
# 1. positions: 只有论点转 active 才可开仓位条目（当前为空——GEV 被定价闸门挡住，纪律生效的证明）
# 2. baskets: 观察篮子——把系统的"排序判断"做成可计量对象，等权、创建日快照、前向跟踪
# 3. 每日盯市由 GitHub Actions 执行（pipelines/ledger/mark_to_market.py），
#    基线价 = 首次运行时最近收盘，写入 data/ledger/baseline.json 后不可变
# 4. 篮子调整 = 新开篮子（旧篮子继续跟踪至标注 retired），禁止原地改成分——防事后美化
# 5. 观察篮子的意义：验证"窄门排序"这个判断本身，与仓位无关；跑输基准=排序逻辑被证伪的证据

