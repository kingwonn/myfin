        market: US
        role: AI训练/推理GPU绝对主导，CUDA生态+NVLink互连构成系统级锁定
        moat: 生态锁定(CUDA)+全栈(芯片-互连-软件)+一年一代的节奏碾压
        risk: 超大厂自研ASIC份额实质性侵蚀训练市场；中国市场政策性归零
        tier: 2   # 确定性最高但弹性衰减，作为链条锚点跟踪而非收益来源
        last_checked: null
        notes: ""
      - name: 博通 Broadcom
        ticker: "NASDAQ:AVGO"
        market: US
        role: 定制ASIC(XPU)设计咽喉——谷歌TPU/Meta等大客户，兼以太网交换芯片(Tomahawk)霸主
        moat: SerDes与先进封装设计能力稀缺；ASIC客户一旦流片即多年锁定
        risk: 大客户自研设计团队内化；ASIC项目周期性砍单
        tier: 1
        last_checked: null
        notes: ""
