# AI 算力中心产业链跟踪清单
# schema（每个标的必填 moat 与 risk，缺一不许入库）:
#   name / ticker(交易所:代码) / market / role(链条位置)
#   moat: 为什么绕不开
#   risk: 什么情况下卡位失效（证伪条件）
#   tier: 1=核心跟踪  2=观察  3=了解背景
#   last_checked / notes
# 状态: DRAFT——待深度研究报告交叉验证后定稿

segments:
  - segment: 芯片-GPU与自研ASIC
