        ticker: "NASDAQ:MRVL"
        market: US
        role: 定制ASIC第二供应商 + 光电互连DSP
        moat: 电互连/光DSP技术组合
        risk: ASIC大单流失（亚马逊Trainium项目份额变化是关键信号）
        tier: 2
        last_checked: null
        notes: ""

