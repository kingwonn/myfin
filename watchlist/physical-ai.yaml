# Physical AI 产业链跟踪清单
# schema 同 compute-chain.yaml（moat/risk 必填；tier 1核心/2观察/3背景）
# 状态: R1 已部分验证(2026-07-07, 见 docs/research/2026-07-07-ai-chain-deep-research-r1.md)
# ⚠ R1+R6 关键结论: A股人形全链条至今无任何具名客户量产定点/订单金额公告(R6 107代理核验)
#   谐波减速器产能利用率约25%(名义产能=消费量4倍)；所有流通市占率数字均被验证否决
#   仓位纪律: 只做期权价值+估值纪律；加码触发器=具名客户定点公告(目前一张都没有)

segments:
  - segment: 大脑层-芯片与仿真
    companies:
      - name: 英伟达 NVIDIA (Isaac/GR00T/Thor)
        ticker: "NASDAQ:NVDA"
        market: US
        role: 机器人大脑三件套：Thor芯片 + Isaac仿真 + GR00T基础模型，试图复制CUDA锁定
        moat: 仿真到部署(sim-to-real)全栈无人能及
        risk: 机器人厂商为控成本转向自研/开源栈
        tier: 1
        last_checked: 2026-07-10
        notes: "R1验证(置信medium,数字自报): GR00T合成数据管线11小时生成等效9个月人类演示数据；合成+真实混合训练成功率45.3%→83.2%(arXiv 2503.24361)。正确表述是'倍增稀缺真实数据'而非'替代数据瓶颈'"

  - segment: 本体层-人形与四足整机
    companies:
      - name: 特斯拉 Tesla (Optimus)
        ticker: "NASDAQ:TSLA"
        market: US
        role: 人形机器人量产叙事第一标的，垂直整合(FSD大脑+自产执行器)
        moat: 制造规模+真实世界数据+自研全栈
        risk: 量产时间表一再推迟；本体业务在车企估值中被稀释
        tier: 2
        last_checked: 2026-07-10
        notes: "R1验证: 时间表已滑坡——2025-10称2026Q1展示V3/年底建百万台产线，2026-04电话会后移为V3年中发布、Q3规模量产。跟踪V3实际发布作为论点触发器"
      - name: 优必选 UBTECH
        ticker: "HKEX:9880"
        market: HK
        role: 国内人形整机上市第一股，工业场景交付领先
        moat: 先发交付订单+品牌
        risk: 持续亏损与股权稀释；订单质量(关联方)存疑
        tier: 3
        last_checked: null
        notes: ""

  - segment: 关节层-减速器/丝杠/执行器（人形BOM价值最集中处）
    companies:
      - name: 哈默纳科 Harmonic Drive Systems
        ticker: "TSE:6324"
        market: JP
        role: 谐波减速器发明者与全球标准
        moat: 精度与寿命的隐性工艺壁垒数十年
        risk: 中国厂商(绿的等)以够用+便宜蚕食；人形转向行星滚柱丝杠方案
        tier: 2
        last_checked: null
        notes: ""
      - name: 绿的谐波 Leaderdrive
        ticker: "SHSE:688017"
        market: CN-A
        role: 国产谐波减速器龙头
        moat: 国产替代+成本；绑定国内人形厂
        risk: 估值透支；技术上限；行业谐波产能利用率~25%产能先于需求过剩
        tier: 3
        last_checked: "2026-07-12"
        notes: "2026-07-08 journal 已定 T2→T3(PE 574倍+定增扩产546%+供Optimus证伪0-3)，YAML 落地延迟4天——本次系统评审(R-3)发现失同步后补正。只看不碰，等定价回归。"
      - name: 三花智控 Sanhua
        ticker: "SZSE:002050"
        market: CN-A
        role: Optimus执行器/关节候选供应商(身份有多方佐证)，热管理主业现金流托底
        moat: 特斯拉深度绑定+精密制造规模
        risk: Optimus放量不及预期；订单叙事已被公司公告辟谣一次，估值透支风险
        tier: 2
        last_checked: 2026-07-10
        notes: "R1证伪: '2025-10获特斯拉6.85亿美元订单'为谣言(0-3票)，公司2025-10-15澄清公告'不属实'；真实合作模式为长期框架+逐年定点。供应商身份本身成立，具体订单无公告级证据"
      - name: 拓普集团 Tuopu
        ticker: "SHSE:601689"
        market: CN-A
        role: 特斯拉系执行器候选供应商，平台型汽车零部件商
        moat: 特斯拉协同开发历史+垂直整合
        risk: 机器人收入几乎为零而估值已计入预期；汽车主业周期；特斯拉营收占比下滑
        tier: 3
        last_checked: 2026-07-10
        notes: "R1证伪: 'Tier 0.5供应商/执行器总成'说法0-3票未过——高盛2025-11调研9家链企均未确认大订单，公司自答'没有大额订单，产能筹备中'；2025年报机器人执行器收入仅1359万元(占营收0.05%)。降为背景跟踪，等公告级证据再升级"
      - name: 恒立液压 Hengli
        ticker: "SHSE:601100"
        market: CN-A
        role: 液压龙头切入滚珠/行星滚柱丝杠——A股人形链中少数有公告级产能+量产证据的标的
        moat: 线性驱动器项目15.27亿元投资，2024-09产线具备完整加工能力、已进入批量生产阶段(年报一手,3-0×2)；2025-09送样百余家整机厂、批量订单持续扩大(3-0)
        risk: 未披露具体客户与订单金额；丝杠环节竞争者众(日系NSK/THK+国产群)
        tier: 1
        last_checked: 2026-07-10
        notes: "R6: T2→T1，公告级证据驱动。主业液压现金流托底"

