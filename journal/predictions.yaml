#
# 规则（追加式）：
# 1. 每条预测必须在事件发生前登记：陈述(可无歧义判定) + 概率 + 到期日 + 判定来源
# 2. 到期后填 resolution: true/false 与 resolved_date，禁止改动原预测
# 3. 季度 /retro 计算 Brier 分 = mean((p - outcome)^2)，越低越好；0.25=瞎猜水平
# 4. 概率是登记时的诚实信念[推断]，不是愿望；不敢给概率的判断=还不配叫判断

